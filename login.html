<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión · Banco de Imágenes HSLV</title>
<link rel="icon" type="image/png" href="Assets/Logo/favicon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

<div class="login-card">
  <img class="login-logo" src="Assets/Logo/hslv-lockup.png" alt="Hospital Susana López de Valencia E.S.E.">
  <div class="login-title">Banco de Imágenes Institucionales</div>
  <div class="login-sub">Inicia sesión con tu cuenta autorizada para continuar.</div>

  <div id="loginAlert"></div>

  <!-- autocomplete="off" en el form y en los dos campos — evita que el navegador sugiera
       autocompletar. Si ya había una contraseña guardada para este origen de antes de este
       cambio, el navegador puede seguir ofreciéndola una vez más hasta que se borre a mano
       desde el administrador de contraseñas del navegador. -->
  <form id="loginForm" autocomplete="off">
    <div class="form-grp">
      <label for="fEmail">Correo</label>
      <input type="email" id="fEmail" name="email" autocomplete="off" required>
    </div>
    <div class="form-grp">
      <label for="fPassword">Contraseña</label>
      <div class="login-pwd-wrap">
        <input type="password" id="fPassword" name="password" autocomplete="off" required>
        <button type="button" class="login-pwd-toggle" id="pwdToggle" aria-label="Mostrar contraseña">
          <svg viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn-pri login-submit" id="submitBtn">Iniciar sesión</button>
  </form>

  <div class="login-footer">¿Problemas para acceder? Contacta al equipo de Comunicaciones del hospital.</div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* Mismo proyecto de Supabase que usa la Edge Function "catalogo" — solo la publishable key,
   nunca la service_role key, que vive únicamente dentro de las Edge Functions. */
var SUPABASE_URL = 'https://jxndazzqsxevlohpfjge.supabase.co';
var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_8d5hFI6V80Qgi5lmw8xfvg_bgtGSHoh';
var supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

var ICON_EYE = '<svg viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
var ICON_EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';
var ICON_ALERT = '<svg viewBox="0 0 24 24" style="width:14px;height:14px;flex-shrink:0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';

var alertBox = document.getElementById('loginAlert');
var form = document.getElementById('loginForm');
var submitBtn = document.getElementById('submitBtn');
var pwdInput = document.getElementById('fPassword');
var pwdToggle = document.getElementById('pwdToggle');

function showError(msg) {
  alertBox.innerHTML = '<div class="error-box"><span class="ib-icon">' + ICON_ALERT + '</span> ' + msg + '</div>';
}
function clearError() {
  alertBox.innerHTML = '';
}

function translateError(message) {
  if (/invalid login credentials/i.test(message)) return 'Correo o contraseña incorrectos.';
  if (/email not confirmed/i.test(message)) return 'Tu cuenta aún no está confirmada.';
  return 'No se pudo iniciar sesión: ' + message;
}

if (new URLSearchParams(location.search).get('expired') === '1') {
  showError('Tu sesión expiró, inicia sesión de nuevo.');
}

// Si ya hay una sesión activa (F5, o volver a abrir la pestaña), pasa directo a la app.
supabase.auth.getSession().then(function (res) {
  if (res.data && res.data.session) window.location.replace('banco_imagenes_hslv.html');
});

pwdToggle.addEventListener('click', function () {
  var showing = pwdInput.type === 'text';
  pwdInput.type = showing ? 'password' : 'text';
  pwdToggle.innerHTML = showing ? ICON_EYE : ICON_EYE_OFF;
  pwdToggle.setAttribute('aria-label', showing ? 'Mostrar contraseña' : 'Ocultar contraseña');
});

form.addEventListener('submit', async function (e) {
  e.preventDefault();
  clearError();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Iniciando sesión...';

  var email = document.getElementById('fEmail').value.trim();
  var password = pwdInput.value;

  var res = await supabase.auth.signInWithPassword({ email: email, password: password });

  if (res.error) {
    showError(translateError(res.error.message));
    submitBtn.disabled = false;
    submitBtn.textContent = 'Iniciar sesión';
    return;
  }

  window.location.replace('banco_imagenes_hslv.html');
});
</script>

</body>
</html>
