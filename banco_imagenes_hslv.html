<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Imágenes Institucionales · HSLV</title>
<link rel="icon" type="image/png" href="Assets/Logo/favicon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<!-- Arma el .zip de descarga múltiple en el navegador — ver downloadAsZip en js/app.js. Sin esto
     no hay backend propio que pueda generar el zip del lado del servidor. -->
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>

<!-- APP — oculta hasta que bootstrapAuth() confirme la sesión de Supabase (login.html); si no
     hay sesión, redirige a login.html antes de mostrar nada. -->
<div id="appShell" style="display:none">

<!-- HEADER -->
<div class="header">
  <div class="header-logo"><img src="Assets/Logo/hslv-mark.png" alt="Hospital Susana López de Valencia"></div>
  <div>
    <div class="header-title">Banco de Imágenes Institucionales</div>
    <div class="header-sub">Hospital Susana López de Valencia E.S.E.</div>
  </div>
  <div class="hdr-right">
    <!-- Solo visible para role='admin' (ver applyRoleUI en js/app.js) -->
    <button class="hdr-btn" id="btnUserAdmin" onclick="openUserAdmin()" style="display:none">
      <svg viewBox="0 0 24 24" stroke-width="2" style="width:13px;height:13px;stroke:currentColor;fill:none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Administrar usuarios
    </button>
    <button class="logout-badge" id="btnLogout" onclick="signOut()">
      <svg viewBox="0 0 24 24" stroke-width="2" style="width:13px;height:13px;stroke:currentColor;fill:none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </button>
  </div>
</div>

<!-- SEARCH BAR -->
<div class="search-bar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar en todas las carpetas..." oninput="scheduleSearch()" disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore="true" data-form-type="other">
  </div>
</div>

<!-- BODY -->
<div class="body">
  <!-- SIDEBAR -->
  <nav class="sidebar" aria-label="Filtros">
    <div class="sidebar-label">Tipo</div>
    <div id="typeList"></div>
    <div class="sdiv"></div>
    <div class="sidebar-label">Etiquetas</div>
    <div class="tag-cloud" id="tagCloud"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div id="alertBox"></div>
    <div id="statsBar" class="stats-bar" style="display:none"></div>
    <div id="toolbar" class="toolbar" style="display:none">
      <select class="sort-sel" id="sortSel" onchange="filterImages()" style="margin-left:auto">
        <option value="date">Más recientes</option>
        <option value="date-asc">Más antiguos</option>
        <option value="name">Nombre A-Z</option>
        <option value="name-desc">Nombre Z-A</option>
      </select>
      <div class="view-toggle">
        <button class="vbtn active" id="btnG" onclick="setView('g')" aria-label="Cuadrícula">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="vbtn" id="btnL" onclick="setView('l')" aria-label="Lista">
          <svg viewBox="0 0 24 24" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="breadcrumbBar" class="breadcrumb"></div>
    <div id="folderList" class="folder-list"></div>
    <div class="grid" id="imageGrid"></div>
    <div id="gridSentinel" style="height:1px"></div>
  </div>
</div>

<!-- BARRA DE SELECCIÓN MÚLTIPLE — oculta hasta que se marque al menos una imagen (ver
     renderSelectionBar/toggleSelect en js/app.js). -->
<div class="selection-bar" id="selectionBar" style="display:none">
  <span class="sb-count" id="sbCount"></span>
  <button type="button" class="btn-sec" onclick="clearSelection()">Cancelar</button>
  <button type="button" class="btn-pri" id="sbDownloadBtn" onclick="downloadSelection()">
    <svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:#fff;fill:none"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>
    Descargar
  </button>
</div>

<!-- MODAL ADMINISTRAR USUARIOS — solo lo abre btnUserAdmin (admin). Ver openUserAdmin/
     closeUserAdmin/renderUserAdminList en js/app.js. -->
<div class="modal-bg" id="userAdminModal" onclick="closeUserAdminBg(event)">
  <div class="modal">
    <div class="mbody">
      <div class="m-title">Administrar usuarios</div>
      <div id="uaAlert"></div>

      <div class="ua-list" id="uaList"></div>

      <div class="ua-new">
        <div class="m-title" style="font-size:13px;margin-bottom:10px">Crear usuario</div>
        <div class="form-grp">
          <label for="uaEmail">Correo</label>
          <!-- autocomplete="off" + los data-*ignore de abajo: el "off" evita las sugerencias
               propias del navegador (direcciones/correos ya usados); los data-*ignore hacen que
               gestores de contraseñas externos (LastPass, 1Password, Bitwarden, Dashlane) no
               metan su propio ícono ni sugerencia encima del campo — esos ignoran autocomplete
               "off" porque no es un login real. -->
          <input type="email" id="uaEmail" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore="true" data-form-type="other">
        </div>
        <div class="form-grp">
          <label for="uaPassword">Contraseña</label>
          <div class="login-pwd-wrap">
            <input type="password" id="uaPassword" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Mínimo 6 caracteres" data-lpignore="true" data-1p-ignore data-bwignore="true" data-form-type="other">
            <button type="button" class="login-pwd-toggle" id="uaPwdToggle" onclick="toggleUaPwdVisibility()" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-grp">
          <label for="uaRole">Rol</label>
          <select id="uaRole">
            <option value="viewer">Usuario</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
      </div>
    </div>
    <div class="m-footer">
      <span class="m-desc-status" id="uaCreateStatus"></span>
      <button class="btn-sec" onclick="closeUserAdmin()">Cerrar</button>
      <button class="btn-pri" id="uaCreateBtn" onclick="createUserAdmin()">
        <svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:#fff;fill:none"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
        Crear usuario
      </button>
    </div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-bg" id="detailModal" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-img-wrap">
      <div id="modalImgInner" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
      <button class="mcl" onclick="closeModal()" aria-label="Cerrar"><svg viewBox="0 0 24 24" stroke-width="2" style="width:15px;height:15px;stroke:currentColor;fill:none"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="mbody">
      <div class="m-title" id="mTitle"></div>
      <div class="m-tags-field">
        <label for="mTagSelect">Etiquetas</label>
        <div class="m-tag-pills" id="mTagPills"></div>
        <select class="tag-pill-add m-tag-select" id="mTagSelect" onchange="if(this.value){addDraftTag(this.value);this.value='';}">
          <option value="">+ Agregar etiqueta</option>
        </select>
      </div>
      <div class="m-desc-field">
        <label for="mDescInput">Descripción detallada</label>
        <textarea id="mDescInput" class="m-desc-input" placeholder="Describe la imagen: personas, contexto, evento, lugar..." oninput="handleDescInput()"></textarea>
        <button type="button" class="btn-sec m-gen-tags-btn" id="mGenTagsBtn" onclick="generateTagSuggestions()"><svg viewBox="0 0 24 24" stroke-width="2" style="width:12px;height:12px;stroke:currentColor;fill:none"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"/></svg> Generar etiquetas</button>
        <span class="m-desc-status" id="mGenTagsStatus"></span>
        <div class="m-tag-suggest-row" id="mTagSuggestRow"></div>
      </div>
      <div class="m-tags-new-field">
        <div class="m-tag-input-row">
          <input id="mTagInput" class="m-tag-input" type="text" placeholder="¿No está en la lista? Escribe una etiqueta nueva" oninput="handleTagInputTyping()" onkeydown="handleTagInputKey(event)">
          <button type="button" class="btn-sec m-tag-add-btn" id="mTagAddBtn" onclick="addTagFromInput()" style="display:none">+ Agregar</button>
        </div>
      </div>
      <div class="m-field"><label>Tipo</label><span id="mType"></span></div>
      <div class="m-field"><label>Tamaño</label><span id="mSize"></span></div>
      <div class="m-field"><label>Modificado</label><span id="mDate"></span></div>
      <div class="m-field"><label>Ver en Drive</label><a id="mLink" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px"><svg viewBox="0 0 24 24" stroke-width="2" style="width:13px;height:13px;stroke:currentColor;fill:none"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Abrir en Google Drive</a></div>
    </div>
    <div class="m-footer">
      <span class="m-desc-status" id="mDescStatus"></span>
      <button class="btn-sec" onclick="openInDrive()"><svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:currentColor;fill:none"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Abrir en Drive</button>
      <button class="btn-sec" onclick="downloadFile()"><svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:currentColor;fill:none"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg> Descargar</button>
      <button class="btn-pri" onclick="saveModalChanges()" id="mSaveBtn"><svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:#fff;fill:none"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg> Guardar cambios</button>
    </div>
  </div>
</div>

</div><!-- /appShell -->

<!-- ?v= evita que el navegador sirva una copia vieja en caché de app.js tras un F5 normal
     (sin Cache-Control desde el servidor estático, un F5 solo revalida el HTML, no los <script
     src>) — subir este número cada vez que se edite app.js. -->
<script src="js/app.js?v=28"></script>
</body>
</html>
