<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Imágenes Institucionales · HSLV</title>
<link rel="icon" type="image/png" href="Assets/Logo/favicon.png">
<link rel="stylesheet" href="css/styles.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<!-- PANTALLA DE ACCESO — neutra, sin marca ni diseño del proyecto -->
<div class="auth-gate" id="authGate">
  <div class="auth-card">
    <div class="auth-title">Acceso restringido</div>
    <p class="auth-desc">Inicia sesión con tu cuenta autorizada para continuar.</p>
    <div id="gateAlert"></div>
    <button class="auth-google-btn" onclick="signIn()">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.5 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.6 29.5 3.5 24 3.5 12.7 3.5 3.5 12.7 3.5 24S12.7 44.5 24 44.5 44.5 35.3 44.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.7 19 12.5 24 12.5c3.1 0 5.8 1.1 8 3l6-6C34.5 5.6 29.5 3.5 24 3.5c-7.5 0-13.9 4.2-17.2 10.4z"/><path fill="#4CAF50" d="M24 44.5c5.4 0 10.3-2.1 14-5.4l-6.5-5.4c-2 1.4-4.6 2.2-7.5 2.2-5.4 0-9.9-3.4-11.5-8.3l-6.6 5.1C9.9 39.9 16.4 44.5 24 44.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6.5 5.4C41.5 36.4 44.5 30.7 44.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Iniciar sesión con Google
    </button>
  </div>
</div>

<!-- APP — oculta hasta iniciar sesión -->
<div id="appShell" style="display:none">

<!-- HEADER -->
<div class="header">
  <div class="header-logo"><img src="Assets/Logo/hslv-mark.png" alt="Hospital Susana López de Valencia"></div>
  <div>
    <div class="header-title">Banco de Imágenes Institucionales</div>
    <div class="header-sub">Hospital Susana López de Valencia E.S.E.</div>
  </div>
  <div class="hdr-right">
    <div class="drive-badge" id="driveBadge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.7 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span id="driveBadgeText">Sin conectar</span>
    </div>
  </div>
</div>

<!-- SEARCH BAR -->
<div class="search-bar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar en todas las carpetas..." oninput="scheduleSearch()" disabled>
  </div>
  <div class="hdr-actions">
    <button class="btn-sec" id="btnConfig" onclick="signOut()" style="font-size:12px">
      <svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:currentColor;fill:none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Cerrar sesión
    </button>
  </div>
</div>

<!-- BODY -->
<div class="body">
  <!-- SIDEBAR -->
  <nav class="sidebar" aria-label="Categorías">
    <div class="sidebar-label">Categorías</div>
    <div id="catList"></div>
    <div class="sdiv"></div>
    <div class="sidebar-label">Tipo</div>
    <div id="typeList"></div>
    <div class="sdiv"></div>
    <div class="sidebar-label">Etiquetas</div>
    <div class="tag-cloud" id="tagCloud"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div id="alertBox"></div>
    <div id="statsBar" class="stats-bar" style="display:none"></div>
    <div id="toolbar" class="toolbar" style="display:none">
      <select class="sort-sel" id="sortSel" onchange="filterImages()" style="margin-left:auto">
        <option value="date">Más recientes</option>
        <option value="name">Nombre A-Z</option>
      </select>
      <div class="view-toggle">
        <button class="vbtn active" id="btnG" onclick="setView('g')" aria-label="Cuadrícula">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="vbtn" id="btnL" onclick="setView('l')" aria-label="Lista">
          <svg viewBox="0 0 24 24" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div id="breadcrumbBar" class="breadcrumb"></div>
    <div id="folderList" class="folder-list"></div>
    <div class="grid" id="imageGrid"></div>
    <div id="gridSentinel" style="height:1px"></div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-bg" id="detailModal" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-img-wrap">
      <div id="modalImgInner" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
      <button class="mcl" onclick="closeModal()" aria-label="Cerrar"><svg viewBox="0 0 24 24" stroke-width="2" style="width:15px;height:15px;stroke:currentColor;fill:none"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="mbody">
      <div class="m-title" id="mTitle"></div>
      <div class="m-tags" id="mTags"></div>
      <div class="m-field"><label>Categoría</label><span id="mCat"></span></div>
      <div class="m-field"><label>Tipo</label><span id="mType"></span></div>
      <div class="m-field"><label>Tamaño</label><span id="mSize"></span></div>
      <div class="m-field"><label>Modificado</label><span id="mDate"></span></div>
      <div class="m-field"><label>Ver en Drive</label><a id="mLink" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:4px"><svg viewBox="0 0 24 24" stroke-width="2" style="width:13px;height:13px;stroke:currentColor;fill:none"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Abrir en Google Drive</a></div>
    </div>
    <div class="m-footer">
      <button class="btn-sec" onclick="openInDrive()"><svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:currentColor;fill:none"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg> Abrir en Drive</button>
      <button class="btn-pri" onclick="downloadFile()"><svg viewBox="0 0 24 24" stroke-width="2" style="width:14px;height:14px;stroke:#fff;fill:none"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg> Descargar</button>
    </div>
  </div>
</div>

</div><!-- /appShell -->

<script src="js/app.js"></script>
</body>
</html>
