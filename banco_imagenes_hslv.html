<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de Imágenes Institucionales · HSLV</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#003B6F;--azul-med:#005A9E;--azul-claro:#D6E4F0;
  --verde:#00796B;--verde-claro:#E0F2F1;
  --bg:#F4F6F9;--card:#ffffff;--text:#1a1a2e;--muted:#6B7280;
  --border:#E5E7EB;--border-hover:#005A9E;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── HEADER ─────────────────────────────────────────── */
.header{background:var(--azul);padding:13px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,59,111,.25)}
.header-logo{width:36px;height:36px;background:rgba(255,255,255,.14);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px}
.header-title{color:#fff;font-size:15px;font-weight:600;line-height:1.2}
.header-sub{color:rgba(255,255,255,.6);font-size:11px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.drive-badge{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11px;padding:5px 10px;border-radius:6px;display:flex;align-items:center;gap:5px}
.drive-badge.ok{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.14)}
.dot{width:6px;height:6px;border-radius:50%;background:#34d399;display:inline-block}

/* ── SEARCH BAR ─────────────────────────────────────── */
.search-bar{background:#fff;border-bottom:1px solid var(--border);padding:11px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
.search-wrap input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--azul-med);box-shadow:0 0 0 3px rgba(0,90,158,.1)}
.hdr-actions{display:flex;gap:8px}
.btn-connect{background:var(--azul);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-connect svg{width:15px;height:15px;stroke:#fff;fill:none}

/* ── LAYOUT ─────────────────────────────────────────── */
.body{display:flex;min-height:calc(100vh - 112px)}
.sidebar{width:185px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:14px 0;overflow-y:auto}
.sidebar-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;padding:0 14px 7px}
.cat-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.cat-item:hover{background:#F0F4F8}
.cat-item.active{background:var(--azul-claro);border-left-color:var(--azul)}
.cat-icon{font-size:16px;width:18px;text-align:center;flex-shrink:0;color:var(--muted)}
.cat-item.active .cat-icon{color:var(--azul)}
.cat-item span{font-size:11px;color:var(--muted);flex:1;line-height:1.3}
.cat-item.active span{color:var(--azul);font-weight:600}
.cat-badge{background:var(--bg);color:var(--muted);font-size:9px;padding:1px 5px;border-radius:8px;border:1px solid var(--border);flex-shrink:0}
.cat-item.active .cat-badge{background:var(--azul);color:#fff;border-color:var(--azul)}
.sdiv{height:1px;background:var(--border);margin:9px 14px}

/* ── MAIN ────────────────────────────────────────────── */
.main{flex:1;padding:16px;overflow-y:auto}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 10px;text-align:center}
.stat-num{font-size:18px;font-weight:700;color:var(--azul)}
.stat-lbl{font-size:9px;color:var(--muted);margin-top:1px;text-transform:uppercase;letter-spacing:.04em}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.results-count{font-size:12px;color:var(--muted);flex:1}
.results-count strong{color:var(--text)}
.sort-sel{font-size:12px;padding:6px 8px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);cursor:pointer}
.view-toggle{display:flex;gap:1px}
.vbtn{background:none;border:1px solid var(--border);padding:6px 8px;cursor:pointer;color:var(--muted)}
.vbtn:first-child{border-radius:7px 0 0 7px}
.vbtn:last-child{border-radius:0 7px 7px 0}
.vbtn.active{background:var(--azul);border-color:var(--azul);color:#fff}
.vbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;display:block}

/* ── GRID / CARDS ─────────────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.grid.lv{grid-template-columns:1fr}
.img-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .14s,box-shadow .14s}
.img-card:hover{border-color:var(--azul-med);box-shadow:0 2px 12px rgba(0,59,111,.1)}
.img-thumb{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.img-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.img-thumb .ph{font-size:28px;opacity:.18;color:var(--azul)}
.overlay{position:absolute;inset:0;background:rgba(0,59,111,.72);display:flex;align-items:center;justify-content:center;gap:8px;opacity:0;transition:opacity .13s}
.img-card:hover .overlay{opacity:1}
.ov-btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;width:31px;height:31px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ov-btn svg{width:15px;height:15px;stroke:#fff;fill:none}
.img-info{padding:8px 10px}
.img-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.img-meta{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.img-date{font-size:9px;color:var(--muted)}
.tag-pill{font-size:9px;padding:1px 5px;border-radius:4px;background:var(--azul-claro);color:var(--azul);font-weight:600}
.tag-pill.g{background:var(--verde-claro);color:var(--verde)}
.img-card.li{display:flex;align-items:center;gap:10px;padding:9px}
.img-card.li .img-thumb{width:76px;height:57px;aspect-ratio:unset;flex-shrink:0;border-radius:7px}
.img-card.li .img-info{flex:1;padding:0}
.img-card.li .img-name{font-size:12px;white-space:normal}

/* ── EMPTY / LOADER ──────────────────────────────────── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);grid-column:1/-1}
.empty .empty-icon{font-size:40px;opacity:.22;display:block;margin-bottom:8px}
.empty p{font-size:13px}
.loader{text-align:center;padding:36px;color:var(--muted);grid-column:1/-1}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--azul);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── SETUP PANEL ─────────────────────────────────────── */
.setup-panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:16px}
.setup-title{font-size:14px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.setup-desc{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.info-box{background:var(--azul-claro);border-radius:8px;padding:11px 13px;font-size:11px;color:#1a3a5c;line-height:1.7;margin-bottom:14px}
.info-box strong{font-weight:600}
.info-box a{color:var(--azul-med)}
.form-grp{margin-bottom:11px}
.form-grp label{display:block;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-grp input{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--bg);color:var(--text);outline:none;transition:border-color .14s}
.form-grp input:focus{border-color:var(--azul-med);box-shadow:0 0 0 3px rgba(0,90,158,.1)}
.form-grp .hint{font-size:10px;color:var(--muted);margin-top:3px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn-pri{background:var(--azul);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-sec{background:none;border:1px solid var(--border);padding:8px 14px;border-radius:8px;font-size:12px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:4px}
.btn-pri:hover{background:#005A9E}
.btn-sec:hover{background:var(--bg)}
.error-box{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:10px 13px;font-size:11px;color:#991B1B;display:flex;gap:8px;align-items:flex-start;margin-bottom:12px}

/* ── MODAL ───────────────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;padding:20px;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:13px;width:100%;max-width:580px;overflow:hidden;display:flex;flex-direction:column;max-height:92vh}
.modal-img-wrap{width:100%;aspect-ratio:16/9;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.modal-img-wrap img{width:100%;height:100%;object-fit:contain}
.modal-img-wrap .ph-lg{font-size:60px;opacity:.13;color:var(--azul)}
.mcl{position:absolute;top:9px;right:9px;background:rgba(0,0,0,.35);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;line-height:1}
.mbody{padding:16px 20px;overflow-y:auto;flex:1}
.m-title{font-size:15px;font-weight:600;margin-bottom:5px}
.m-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.m-field{display:flex;gap:8px;margin-bottom:8px;font-size:12px;align-items:flex-start}
.m-field label{color:var(--muted);min-width:95px;flex-shrink:0;font-weight:500;padding-top:1px}
.m-field span{color:var(--text);line-height:1.5}
.m-field a{color:var(--azul-med);text-decoration:none;font-size:12px}
.m-field a:hover{text-decoration:underline}
.m-footer{border-top:1px solid var(--border);padding:12px 20px;display:flex;gap:7px;justify-content:flex-end}

/* ── TAG CLOUD ───────────────────────────────────────── */
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px;padding:4px 14px 8px}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg);color:var(--muted);cursor:pointer;border:1px solid var(--border);transition:background .12s}
.tag:hover,.tag.active{background:var(--azul-claro);color:var(--azul);border-color:var(--azul-med)}

/* ── RESPONSIVE ──────────────────────────────────────── */
@media(max-width:600px){
  .sidebar{display:none}
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-logo">📷</div>
  <div>
    <div class="header-title">Banco de Imágenes Institucionales</div>
    <div class="header-sub">Hospital Susana López de Valencia E.S.E.</div>
  </div>
  <div class="hdr-right">
    <div class="drive-badge" id="driveBadge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.7 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.61 1h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      <span id="driveBadgeText">Sin conectar</span>
    </div>
  </div>
</div>

<!-- SEARCH BAR -->
<div class="search-bar">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Buscar por nombre, categoría, área..." oninput="filterImages()" disabled>
  </div>
  <div class="hdr-actions">
    <button class="btn-sec" id="btnConfig" onclick="showSetup()" style="font-size:12px">
      ⚙ Configurar Drive
    </button>
  </div>
</div>

<!-- BODY -->
<div class="body">
  <!-- SIDEBAR -->
  <nav class="sidebar" aria-label="Categorías">
    <div class="sidebar-label">Categorías</div>
    <div id="catList"></div>
    <div class="sdiv"></div>
    <div class="sidebar-label">Tipo</div>
    <div id="typeList"></div>
    <div class="sdiv"></div>
    <div class="sidebar-label">Etiquetas</div>
    <div class="tag-cloud" id="tagCloud"></div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div id="setupSection"></div>
    <div id="alertBox"></div>
    <div id="statsBar" class="stats-bar" style="display:none"></div>
    <div id="toolbar" class="toolbar" style="display:none">
      <div class="results-count" id="resultsCount"></div>
      <select class="sort-sel" id="sortSel" onchange="filterImages()">
        <option value="date">Más recientes</option>
        <option value="name">Nombre A-Z</option>
      </select>
      <div class="view-toggle">
        <button class="vbtn active" id="btnG" onclick="setView('g')" aria-label="Cuadrícula">
          <svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="vbtn" id="btnL" onclick="setView('l')" aria-label="Lista">
          <svg viewBox="0 0 24 24" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="grid" id="imageGrid"></div>
  </div>
</div>

<!-- MODAL DETALLE -->
<div class="modal-bg" id="detailModal" onclick="closeModalBg(event)">
  <div class="modal">
    <div class="modal-img-wrap">
      <div id="modalImgInner" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"></div>
      <button class="mcl" onclick="closeModal()" aria-label="Cerrar">✕</button>
    </div>
    <div class="mbody">
      <div class="m-title" id="mTitle"></div>
      <div class="m-tags" id="mTags"></div>
      <div class="m-field"><label>Categoría</label><span id="mCat"></span></div>
      <div class="m-field"><label>Tipo</label><span id="mType"></span></div>
      <div class="m-field"><label>Tamaño</label><span id="mSize"></span></div>
      <div class="m-field"><label>Modificado</label><span id="mDate"></span></div>
      <div class="m-field"><label>Ver en Drive</label><a id="mLink" href="#" target="_blank" rel="noopener">🔗 Abrir en Google Drive</a></div>
    </div>
    <div class="m-footer">
      <button class="btn-sec" onclick="openInDrive()">↗ Abrir en Drive</button>
      <button class="btn-pri" onclick="downloadFile()">⬇ Descargar</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   CONFIGURACIÓN — EDITA ESTOS DOS VALORES
   ══════════════════════════════════════════════════ */
var CONFIG = {
  API_KEY: '',        // ← Pega aquí tu API Key de Google Drive
  FOLDER_ID: '',      // ← Pega aquí el ID de la carpeta raíz en Drive
};
/* ══════════════════════════════════════════════════ */

var CATS = [
  {id:'all',    label:'Todas las imágenes', icon:'📷'},
  {id:'talento',label:'Talento Humano',     icon:'👥'},
  {id:'servicios',label:'Servicios Asistenciales',icon:'🏥'},
  {id:'infra',  label:'Infraestructura',    icon:'🏢'},
  {id:'eventos',label:'Eventos Institucionales',icon:'📅'},
  {id:'comunidad',label:'Comunidad y Pacientes',icon:'🤝'},
  {id:'rse',    label:'Responsabilidad Social',icon:'🌱'},
  {id:'gestion',label:'Gestión y Adm.',     icon:'💼'},
  {id:'especial',label:'Material Especial', icon:'✨'},
];
var TYPES=[{id:'all',label:'Todos los formatos'},{id:'jpg',label:'JPG / JPEG'},{id:'png',label:'PNG'},{id:'webp',label:'WEBP'}];
var TAGS=['Humanización','Jornada de salud','Vacunación','Acreditación','Bienestar laboral','Urgencias','Comunidad','Formación','Prevención','Calidad'];
var CAT_KW={
  talento:['talento','personal','enfermera','medico','médico','bienestar','capacitacion','formacion','auxiliar','profesional'],
  servicios:['urgencias','laboratorio','farmacia','cirugia','hospitaliz','consulta','triage','medicamento'],
  infra:['fachada','edificio','sala','instalacion','señalizacion','infraestructura','remodelacion','sede'],
  eventos:['evento','ceremonia','lanzamiento','celebracion','dia del','graduacion','acto','reconocimiento'],
  comunidad:['comunidad','paciente','jornada','vacunacion','barrio','usuario','extramural'],
  rse:['ambiental','social','voluntariado','sostenib','arbol','reciclaje','responsabilidad'],
  gestion:['reunion','comite','directiva','gestion','rendicion','mipg','calidad','acreditacion'],
  especial:['redes','prensa','banner','diseño','portada','publicidad','institucional'],
};

var allFiles=[], activeCat='all', activeType='all', activeTag=null, viewMode='g', currentFile=null;
var apiKey=CONFIG.API_KEY, folderId=CONFIG.FOLDER_ID;

function detectCat(name){
  var n=name.toLowerCase();
  for(var cat in CAT_KW){ if(CAT_KW[cat].some(function(k){return n.indexOf(k)>-1;})) return cat; }
  return 'especial';
}

function buildSidebar(){
  var cl=document.getElementById('catList'); cl.innerHTML='';
  CATS.forEach(function(c){
    var count=c.id==='all'?allFiles.length:allFiles.filter(function(f){return f.cat===c.id;}).length;
    var d=document.createElement('div');
    d.className='cat-item'+(activeCat===c.id?' active':'');
    d.innerHTML='<span class="cat-icon">'+c.icon+'</span><span>'+c.label+'</span><span class="cat-badge">'+count+'</span>';
    d.onclick=(function(cid){return function(){activeCat=cid;activeTag=null;buildSidebar();buildTags();filterImages();};})(c.id);
    cl.appendChild(d);
  });
  var tl=document.getElementById('typeList'); tl.innerHTML='';
  TYPES.forEach(function(t){
    var d=document.createElement('div');
    d.className='cat-item'+(activeType===t.id?' active':'');
    d.innerHTML='<span style="font-size:11px;flex:1">'+t.label+'</span>';
    d.onclick=(function(tid){return function(){activeType=tid;buildSidebar();filterImages();};})(t.id);
    tl.appendChild(d);
  });
}

function buildTags(){
  var tc=document.getElementById('tagCloud'); tc.innerHTML='';
  TAGS.forEach(function(t){
    var s=document.createElement('span');
    s.className='tag'+(activeTag===t?' active':'');
    s.textContent=t;
    s.onclick=(function(tag){return function(){activeTag=activeTag===tag?null:tag;activeCat='all';buildSidebar();buildTags();filterImages();};})(t);
    tc.appendChild(s);
  });
}

function buildStats(){
  var sb=document.getElementById('statsBar'); sb.style.display='grid';
  var total=allFiles.length;
  var cats=new Set(allFiles.map(function(f){return f.cat;})).size;
  var mb=(allFiles.reduce(function(a,f){return a+(parseInt(f.size)||0);},0)/1048576).toFixed(1);
  var hoy=new Date().toISOString().slice(0,7);
  var recent=allFiles.filter(function(f){return f.modifiedTime&&f.modifiedTime.startsWith(hoy);}).length;
  sb.innerHTML='<div class="stat"><div class="stat-num">'+total+'</div><div class="stat-lbl">Imágenes</div></div>'+
    '<div class="stat"><div class="stat-num">'+cats+'</div><div class="stat-lbl">Categorías</div></div>'+
    '<div class="stat"><div class="stat-num">'+mb+' MB</div><div class="stat-lbl">Almacenamiento</div></div>'+
    '<div class="stat"><div class="stat-num">'+recent+'</div><div class="stat-lbl">Este mes</div></div>';
}

function filterImages(){
  var q=document.getElementById('searchInput').value.toLowerCase();
  var sort=document.getElementById('sortSel').value;
  var filtered=allFiles.filter(function(f){
    var matchCat=activeCat==='all'||f.cat===activeCat;
    var ext=(f.name.split('.').pop()||'').toLowerCase();
    var matchType=activeType==='all'||(activeType==='jpg'&&(ext==='jpg'||ext==='jpeg'))||(activeType===ext);
    var matchQ=!q||f.name.toLowerCase().indexOf(q)>-1;
    var matchTag=!activeTag||f.tags.indexOf(activeTag)>-1;
    return matchCat&&matchType&&matchQ&&matchTag;
  });
  if(sort==='name') filtered.sort(function(a,b){return a.name.localeCompare(b.name);});
  else filtered.sort(function(a,b){return (b.modifiedTime||'').localeCompare(a.modifiedTime||'');});
  var rc=document.getElementById('resultsCount');
  rc.innerHTML='<strong>'+filtered.length+'</strong> imagen'+(filtered.length!==1?'es':'')+' encontrada'+(filtered.length!==1?'s':'');
  renderGrid(filtered);
}

function renderGrid(filtered){
  var grid=document.getElementById('imageGrid');
  grid.className='grid'+(viewMode==='l'?' lv':'');
  if(!filtered||!filtered.length){
    grid.innerHTML='<div class="empty"><span class="empty-icon">🔍</span><p>No hay imágenes con ese criterio de búsqueda.</p></div>';
    return;
  }
  grid.innerHTML=filtered.map(function(f){
    var catObj=CATS.find(function(c){return c.id===f.cat;})||CATS[CATS.length-1];
    var thumb=f.thumbnailLink?
      '<img src="'+f.thumbnailLink.replace('=s220','=s400')+'" alt="'+escHtml(f.name)+'" loading="lazy" onerror="this.style.display=\'none\'">':
      '<span class="ph">'+catObj.icon+'</span>';
    var isLi=viewMode==='l';
    return '<div class="img-card'+(isLi?' li':'')+'" onclick="openModal(\''+f.id+'\')" tabindex="0" role="button" aria-label="'+escHtml(f.name)+'">'+
      '<div class="img-thumb">'+thumb+
      '<div class="overlay">'+
        '<div class="ov-btn" title="Ver"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>'+
        '<div class="ov-btn" title="Descargar"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></div>'+
      '</div></div>'+
      '<div class="img-info">'+
        '<div class="img-name">'+escHtml(f.name)+'</div>'+
        '<div class="img-meta">'+
          '<span class="img-date">'+formatDate(f.modifiedTime)+'</span>'+
          '<span class="tag-pill">'+catObj.label.split(' ')[0]+'</span>'+
        '</div>'+
      '</div></div>';
  }).join('');
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function formatDate(d){
  if(!d) return '—';
  var dt=new Date(d);
  var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return dt.getDate()+' '+m[dt.getMonth()]+' '+dt.getFullYear();
}

function formatSize(b){
  if(!b) return '—';
  var n=parseInt(b);
  return n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
}

function openModal(id){
  currentFile=allFiles.find(function(f){return f.id===id;});
  if(!currentFile) return;
  var wrap=document.getElementById('modalImgInner');
  if(currentFile.thumbnailLink){
    wrap.innerHTML='<img src="'+currentFile.thumbnailLink.replace('=s220','=s800')+'" alt="'+escHtml(currentFile.name)+'" style="width:100%;height:100%;object-fit:contain">';
  } else {
    var catObj=CATS.find(function(c){return c.id===currentFile.cat;})||CATS[CATS.length-1];
    wrap.innerHTML='<span class="ph-lg">'+catObj.icon+'</span>';
  }
  var catObj=CATS.find(function(c){return c.id===currentFile.cat;})||CATS[CATS.length-1];
  document.getElementById('mTitle').textContent=currentFile.name;
  document.getElementById('mTags').innerHTML='<span class="tag-pill">'+catObj.label+'</span>';
  document.getElementById('mCat').textContent=catObj.label;
  document.getElementById('mType').textContent=(currentFile.mimeType||'').replace('image/','').toUpperCase();
  document.getElementById('mSize').textContent=formatSize(currentFile.size);
  document.getElementById('mDate').textContent=formatDate(currentFile.modifiedTime);
  var lnk=document.getElementById('mLink');
  lnk.href=currentFile.webViewLink||'#';
  document.getElementById('detailModal').classList.add('open');
}

function closeModal(){document.getElementById('detailModal').classList.remove('open');}
function closeModalBg(e){if(e.target.id==='detailModal') closeModal();}
function openInDrive(){if(currentFile&&currentFile.webViewLink) window.open(currentFile.webViewLink,'_blank');}
function downloadFile(){
  if(!currentFile) return;
  var url=currentFile.webContentLink||'https://drive.google.com/uc?export=download&id='+currentFile.id;
  window.open(url,'_blank');
}
function setView(v){
  viewMode=v;
  document.getElementById('btnG').className='vbtn'+(v==='g'?' active':'');
  document.getElementById('btnL').className='vbtn'+(v==='l'?' active':'');
  filterImages();
}

/* ── CONEXIÓN DRIVE ───────────────────────────────── */
async function loadFromDrive(){
  var grid=document.getElementById('imageGrid');
  grid.innerHTML='<div class="loader"><div class="spinner"></div><p>Conectando con Google Drive...</p></div>';
  document.getElementById('toolbar').style.display='flex';
  document.getElementById('searchInput').disabled=false;

  var mimes='image/jpeg,image/png,image/webp,image/gif,image/bmp,image/tiff';
  var mimeQ=mimes.split(',').map(function(m){return "mimeType='"+m+"'";}).join(' or ');
  var folderQ=folderId?" and '"+folderId+"' in parents":'';
  var q='('+mimeQ+')'+folderQ+' and trashed=false';
  var fields='files(id,name,mimeType,thumbnailLink,webViewLink,webContentLink,size,modifiedTime)';
  var url='https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields='+encodeURIComponent(fields)+'&pageSize=200&orderBy=modifiedTime+desc&key='+apiKey;

  try{
    var res=await fetch(url);
    var data=await res.json();
    if(data.error) throw new Error(data.error.message);
    allFiles=(data.files||[]).map(function(f){
      return Object.assign({},f,{cat:detectCat(f.name),tags:[]});
    });
    if(!allFiles.length){
      grid.innerHTML='<div class="empty"><span class="empty-icon">📂</span><p>No se encontraron imágenes en la carpeta de Drive indicada.<br>Verifica que la carpeta tenga imágenes y esté compartida.</p></div>';
      return;
    }
    buildStats(); buildSidebar(); buildTags(); filterImages();
    var badge=document.getElementById('driveBadge');
    badge.classList.add('ok');
    badge.innerHTML='<span class="dot"></span> '+allFiles.length+' imágenes · Drive';
    document.getElementById('setupSection').innerHTML='';
    document.getElementById('alertBox').innerHTML='';
  } catch(e){
    grid.innerHTML='';
    document.getElementById('toolbar').style.display='none';
    document.getElementById('statsBar').style.display='none';
    document.getElementById('alertBox').innerHTML='<div class="error-box">⚠ <div><strong>Error al conectar:</strong> '+e.message+'<br>Verifica tu API Key y que la carpeta esté compartida correctamente.</div></div>';
    showSetup();
  }
}

    '<div class="hint">Déjalo vacío para buscar en todo el Drive (más lento). Recomendado: usa la carpeta raíz del banco.</div></div>'+
    '<div class="btn-row">'+
      '<button class="btn-pri" onclick="connectDrive()">🔌 Conectar y cargar imágenes</button>'+
      '<button class="btn-sec" onclick="loadDemo()">👁 Ver demo sin Drive</button>'+
    '</div></div>';
}

function connectDrive(){
  apiKey=document.getElementById('inputApiKey').value.trim();
  folderId=document.getElementById('inputFolderId').value.trim();
  if(!apiKey){
    document.getElementById('alertBox').innerHTML='<div class="error-box">⚠ Debes ingresar una API Key válida de Google Drive.</div>';
    return;
  }
  document.getElementById('alertBox').innerHTML='';
  loadFromDrive();
}
